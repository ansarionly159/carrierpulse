name: Daily FMCSA Fetch

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fetch script
        run: node fetch-fmcsa-data.js
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/carriers.json
          git diff --quiet --cached || git commit -m "Daily FMCSA data update"
          git push
